name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Re-create Android Project Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.kil --project-name kil .
          cp -r ../lib .
          cp ../pubspec.yaml .
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIL-app-release
          path: app-release.apk
